<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Player</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/turntable.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>Vinyl Player</h1>
        </header>

        <main class="main-content">
            <!-- Tocadiscos -->
            <div class="turntable">
                <div class="turntable-base">
                    <!-- Plato giratorio -->
                    <div class="platter">
                        <!-- Vinilo -->
                        <div class="vinyl" id="vinyl">
                            <div class="vinyl-grooves"></div>
                            <div class="vinyl-label">
                                <span class="label-title" id="labelTitle">Sin cancion</span>
                                <span class="label-artist" id="labelArtist">---</span>
                            </div>
                            <div class="vinyl-shine"></div>
                        </div>
                    </div>

                    <!-- Brazo del tocadiscos -->
                    <div class="tonearm-assembly">
                        <div class="tonearm-base"></div>
                        <div class="tonearm" id="tonearm">
                            <div class="tonearm-arm"></div>
                            <div class="tonearm-head">
                                <div class="tonearm-needle"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Indicador de encendido -->
                    <div class="power-light" id="powerLight"></div>
                </div>
            </div>

            <!-- Controles de reproduccion -->
            <div class="controls-panel">
                <div class="progress-container">
                    <span class="time-display" id="currentTime">0:00</span>
                    <input type="range" class="progress-bar" id="progressBar" min="0" max="100" value="0">
                    <span class="time-display" id="totalTime">0:00</span>
                </div>

                <div class="playback-controls">
                    <button class="control-btn" id="prevBtn" title="Anterior">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                        </svg>
                    </button>
                    <button class="control-btn btn-play" id="playBtn" title="Reproducir">
                        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="stopBtn" title="Detener">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 6h12v12H6z"/>
                        </svg>
                    </button>
                    <button class="control-btn" id="nextBtn" title="Siguiente">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                        </svg>
                    </button>
                </div>

                <div class="secondary-controls">
                    <div class="volume-container">
                        <svg class="volume-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                        </svg>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
                    </div>

                    <div class="speed-container">
                        <span class="speed-label">Velocidad</span>
                        <div class="speed-selector" id="speedSelector">
                            <button class="speed-btn" data-speed="0.5">0.5x</button>
                            <button class="speed-btn" data-speed="0.75">0.75x</button>
                            <button class="speed-btn active" data-speed="1">1x</button>
                            <button class="speed-btn" data-speed="1.25">1.25x</button>
                            <button class="speed-btn" data-speed="1.5">1.5x</button>
                            <button class="speed-btn" data-speed="2">2x</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Playlist y carga de archivos -->
            <div class="playlist-section">
                <div class="file-drop-zone" id="dropZone">
                    <p>Arrastra archivos de audio aqui</p>
                    <p>o</p>
                    <input type="file" id="fileInput" accept="audio/*" multiple style="display: none;">
                    <label class="file-input-label" for="fileInput">
                        Seleccionar archivos
                    </label>
                </div>

                <div class="playlist" id="playlist">
                    <h3>Lista de reproduccion</h3>
                    <ul class="playlist-items" id="playlistItems">
                        <!-- Las canciones se anaden dinamicamente -->
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
